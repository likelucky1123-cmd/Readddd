<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#807797">
    <meta name="description" content="Moonlight_童話鎮：專屬於你的月光閱讀書架。">
    <title>Moonlight_童話鎮</title>
    <!-- 加入專屬 App 圖標 -->
    <link rel="icon" href="IMG_5505.jpeg">
    <link rel="apple-touch-icon" href="IMG_5505.jpeg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'custom-purple': {
                            50: '#fcfcfd',
                            100: '#f3f3f5',
                            200: '#e8e7ec', 
                            300: '#d4d1dc',
                            400: '#b8b3c6',
                            500: '#9b94af',
                            600: '#807797',
                            700: '#6a617e',
                            800: '#585167',
                            900: '#4a4456',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8fafc; }
        .glass-panel { background-color: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .reader-theme-light { background-color: #ffffff; color: #334155; }
        .reader-theme-sepia { background-color: #fdf6e3; color: #433422; }
        .reader-theme-dark { background-color: #1e1e24; color: #cbd5e1; }
        
        .novel-content { white-space: pre-wrap; line-height: 2.2; letter-spacing: 0.05em; transition: all 0.3s ease; }
        .fast-spin { animation: spin 0.6s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 左滑/右滑雙向互動 (Bidirectional Swipe) 基礎設定 */
        .swipe-container { position: relative; overflow: hidden; width: 100%; touch-action: pan-y; }
        .swipe-content { position: relative; z-index: 10; width: 100%; will-change: transform; }
        .swipe-actions-right { position: absolute; right: 0; top: 0; bottom: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; gap: 12px; }
        .swipe-actions-left { position: absolute; left: 0; top: 0; bottom: 0; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 70px; gap: 12px; }
    </style>
</head>
<body class="font-sans text-slate-800 min-h-screen flex flex-col relative selection:bg-custom-purple-200 selection:text-custom-purple-900">

    <!-- ==========================================
         身分驗證區塊
         ========================================== -->
    <div id="auth-container" class="min-h-screen items-center justify-center p-4 bg-custom-purple-50 z-50" style="display:none;">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 relative overflow-hidden border border-custom-purple-100">
            <div id="login-section" class="transition-all duration-300 transform translate-x-0">
                <div class="text-center mb-8">
                    <i class="fa-solid fa-book text-4xl text-custom-purple-600 mb-3 drop-shadow-md"></i>
                    <h2 class="text-2xl font-bold text-custom-purple-800">Moonlight_童話鎮</h2>
                    <p class="text-sm text-custom-purple-500 mt-1">登入以繼續您的閱讀旅程</p>
                </div>
                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-custom-purple-700 mb-1">電子郵件</label>
                        <input type="email" id="login-email" required class="w-full px-4 py-3 rounded-xl border border-custom-purple-200 bg-custom-purple-50 focus:bg-white focus:ring-2 focus:ring-custom-purple-400 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-custom-purple-700 mb-1">密碼</label>
                        <input type="password" id="login-password" required class="w-full px-4 py-3 rounded-xl border border-custom-purple-200 bg-custom-purple-50 focus:bg-white focus:ring-2 focus:ring-custom-purple-400 outline-none transition-all">
                    </div>
                    <div id="login-error" class="text-red-500 text-sm font-bold hidden text-center"></div>
                    <button type="submit" class="w-full bg-custom-purple-600 hover:bg-custom-purple-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-transform active:scale-95 flex justify-center items-center mt-2">
                        <span id="login-btn-text">登入書架</span>
                        <i id="login-spinner" class="fa-solid fa-circle-notch fast-spin ml-2 hidden"></i>
                    </button>
                </form>
                <div class="mt-6 text-center text-sm font-bold text-custom-purple-500">
                    還沒有帳號？ <a href="#" id="switch-to-register" class="text-custom-purple-700 hover:underline">建立新書架</a>
                </div>
            </div>

            <div id="register-section" class="hidden absolute top-0 left-0 w-full h-full p-8 bg-white transition-all duration-300 transform translate-x-full">
                <div class="text-center mb-6">
                    <button id="switch-to-login-icon" class="absolute left-6 top-8 text-custom-purple-400 hover:text-custom-purple-600 transition-colors">
                        <i class="fa-solid fa-arrow-left text-xl"></i>
                    </button>
                    <i class="fa-solid fa-user-plus text-4xl text-custom-purple-600 mb-3"></i>
                    <h2 class="text-2xl font-bold text-custom-purple-800">建立新書架</h2>
                </div>
                <form id="register-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-custom-purple-700 mb-1">電子郵件</label>
                        <input type="email" id="reg-email" required class="w-full px-4 py-3 rounded-xl border border-custom-purple-200 bg-custom-purple-50 focus:bg-white focus:ring-2 focus:ring-custom-purple-400 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-custom-purple-700 mb-1">密碼</label>
                        <input type="password" id="reg-password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-custom-purple-200 bg-custom-purple-50 focus:bg-white focus:ring-2 focus:ring-custom-purple-400 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-custom-purple-700 mb-1">重複確認密碼</label>
                        <input type="password" id="reg-confirm-password" required minlength="6" class="w-full px-4 py-3 rounded-xl border border-custom-purple-200 bg-custom-purple-50 focus:bg-white focus:ring-2 focus:ring-custom-purple-400 outline-none transition-all">
                    </div>
                    <div id="reg-error" class="text-red-500 text-sm font-bold hidden text-center"></div>
                    <button type="submit" class="w-full bg-custom-purple-600 hover:bg-custom-purple-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-transform active:scale-95 flex justify-center items-center mt-2">
                        <span id="reg-btn-text">註冊帳號</span>
                        <i id="reg-spinner" class="fa-solid fa-circle-notch fast-spin ml-2 hidden"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- ==========================================
         主要應用程式區塊
         ========================================== -->
    <div id="app-container" class="hidden flex-1 flex flex-col relative h-screen overflow-hidden">
        <!-- 頂部導航列 -->
        <header class="bg-white/90 backdrop-blur-md shadow-sm z-30 border-b border-custom-purple-100 shrink-0">
            <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                <h1 class="text-lg md:text-xl font-bold text-custom-purple-800 flex items-center cursor-pointer" onclick="window.app.switchView('categories')">
                    <div class="bg-custom-purple-200 text-custom-purple-700 w-8 h-8 rounded-lg flex items-center justify-center mr-2 shadow-inner">
                        <i class="fa-solid fa-book-open"></i>
                    </div>
                    <span id="header-title">Moonlight_童話鎮</span>
                </h1>
                <div class="flex items-center gap-3">
                    <!-- 用戶設定按鈕 -->
                    <button id="btn-open-profile" class="flex items-center gap-2 bg-white border border-custom-purple-200 pl-2 pr-3 py-1.5 rounded-xl shadow-sm hover:border-custom-purple-400 hover:shadow-md transition-all">
                        <div class="w-6 h-6 rounded-full overflow-hidden bg-custom-purple-100 border border-custom-purple-200 flex items-center justify-center text-custom-purple-400 shrink-0">
                            <img id="header-avatar" src="" class="hidden w-full h-full object-cover"/>
                            <i id="header-avatar-icon" class="fa-solid fa-user text-xs"></i>
                        </div>
                        <span id="header-nickname" class="text-sm font-bold text-custom-purple-800 block max-w-[100px] truncate">未命名讀者</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 內容主體區 -->
        <main class="flex-1 overflow-y-auto w-full relative bg-slate-50/30" id="main-scroll-area">
            <div class="max-w-5xl mx-auto px-4 pt-5 pb-24 md:py-6 md:pb-24 w-full h-full flex flex-col">
                <button id="btn-back" class="hidden self-start mb-4 text-sm font-bold text-custom-purple-600 hover:bg-custom-purple-100 bg-white/80 border border-custom-purple-100 shadow-sm px-3.5 py-2 rounded-xl transition-colors">
                    <i class="fa-solid fa-chevron-left mr-1"></i> 返回
                </button>
                
                <!-- 視圖 1: 分類總覽首頁 (Categories Dashboard) -->
                <div id="view-categories" class="view-section min-h-full flex flex-col">
                    
                    <!-- 閱讀統計與背景卡片 -->
                    <div class="relative w-full rounded-3xl overflow-hidden shadow-md min-h-[170px] h-[30vh] max-h-[220px] flex flex-col shrink-0 bg-custom-purple-400 border border-custom-purple-300 mb-6">
                        <div id="dashboard-bg-layer" class="absolute inset-0 bg-cover bg-center transition-opacity duration-500 opacity-0"></div>
                        <div class="absolute inset-0 bg-slate-900/20 bg-gradient-to-t from-slate-900/80 via-transparent to-slate-900/40 pointer-events-none transition-all duration-500"></div>
                        
                        <div class="relative z-10 text-white drop-shadow-md flex-1 flex flex-col p-6">
                            <h2 class="text-xl font-bold flex items-center gap-2 pt-2">
                                <i class="fa-solid fa-chart-pie text-custom-purple-100"></i> 閱讀統計
                            </h2>
                            <div class="grid grid-cols-3 gap-4 text-center divide-x divide-white/30 border-t border-white/30 pt-4 mt-auto">
                                <div>
                                    <div class="text-xs text-custom-purple-50 font-bold mb-1 uppercase tracking-wider">藏書總量</div>
                                    <div class="text-2xl font-black font-mono" id="stat-total-books">0</div>
                                </div>
                                <div class="cursor-pointer hover:opacity-70 transition-opacity" onclick="window.app.openLibrary('liked')" title="點擊查看喜歡的書">
                                    <div class="text-xs text-custom-purple-50 font-bold mb-1 uppercase tracking-wider">喜歡的書 <i class="fa-solid fa-chevron-right text-[10px] ml-0.5"></i></div>
                                    <div class="text-2xl font-black font-mono text-red-200" id="stat-liked-books">0</div>
                                </div>
                                <div class="cursor-pointer hover:opacity-70 transition-opacity" onclick="window.app.openLibrary('favorited')" title="點擊查看收藏的書">
                                    <div class="text-xs text-custom-purple-50 font-bold mb-1 uppercase tracking-wider">收藏的書 <i class="fa-solid fa-chevron-right text-[10px] ml-0.5"></i></div>
                                    <div class="text-2xl font-black font-mono text-yellow-200" id="stat-favorited-books">0</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 書架標題與常駐搜尋欄 -->
                    <div class="flex items-center gap-3 mb-4 shrink-0">
                        <h3 class="text-lg md:text-xl font-bold text-custom-purple-800 flex items-center gap-2 whitespace-nowrap shrink-0">
                            <i class="fa-solid fa-layer-group text-custom-purple-500"></i> 我的書架
                        </h3>
                        <div id="search-bar-container" class="flex-1 min-w-0">
                            <div class="relative">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-custom-purple-400"></i>
                                <input type="text" id="search-input" oninput="window.app.handleSearch(this.value)" placeholder="搜尋分類、書名或作者..." class="w-full min-w-0 pl-9 pr-3 py-2.5 bg-white rounded-xl border border-custom-purple-200 focus:ring-2 focus:ring-custom-purple-400 outline-none text-sm font-bold text-custom-purple-800 shadow-sm">
                            </div>
                        </div>
                    </div>

                    <!-- 合集名稱：按鈕式橫向選單 -->
                    <div id="categories-grid" class="flex flex-nowrap items-center gap-2 overflow-x-auto overflow-y-hidden hide-scrollbar snap-x snap-mandatory pb-2 shrink-0 min-h-[42px]">
                        <!-- 動態生成合集按鈕，可左右滑動瀏覽 -->
                    </div>

                    <!-- 點選合集後，在下方顯示該合集的書籍 -->
                    <div class="flex items-center justify-between gap-2 mt-2 mb-2 shrink-0">
                        <h4 id="dashboard-books-title" class="text-sm font-bold text-custom-purple-800 truncate">合集裡的書</h4>
                        <span id="dashboard-books-count" class="text-[11px] font-bold text-custom-purple-400 shrink-0">0 本書</span>
                    </div>
                    <div id="dashboard-books-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 pb-2 pr-1">
                        <!-- 所選合集的書籍 -->
                    </div>
                </div>

                <!-- 視圖 2: 單一分類書籍列表 (Library View) -->
                <div id="view-library" class="view-section hidden">
                    <div class="flex justify-between items-center mb-4 border-b border-custom-purple-100 pb-4">
                        <div class="flex items-center gap-2">
                            <h2 id="current-category-display" class="text-2xl font-bold text-custom-purple-800 truncate pr-2">分類名稱</h2>
                            <span class="bg-custom-purple-100 text-custom-purple-700 text-xs font-bold px-3 py-1 rounded-full shrink-0" id="current-category-count">0 本書</span>
                        </div>
                        <button onclick="window.app.toggleSearchLibrary()" class="text-custom-purple-500 hover:text-custom-purple-700 w-10 h-10 rounded-full hover:bg-custom-purple-100 flex items-center justify-center transition-colors shadow-sm">
                            <i class="fa-solid fa-magnifying-glass text-lg"></i>
                        </button>
                    </div>

                    <div id="search-bar-container-library" class="hidden mb-6 transition-all">
                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-custom-purple-400"></i>
                            <input type="text" id="search-input-library" oninput="window.app.handleSearchLibrary(this.value)" placeholder="搜尋書名或作者..." class="w-full pl-11 pr-4 py-3 bg-white rounded-xl border border-custom-purple-200 focus:ring-2 focus:ring-custom-purple-400 outline-none font-bold text-custom-purple-800 shadow-sm">
                        </div>
                    </div>

                    <!-- 小說網格 -->
                    <div id="library-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-5">
                        <!-- 動態生成小說卡片 -->
                    </div>
                    
                    <div id="library-empty" class="hidden flex flex-col items-center justify-center py-20 text-custom-purple-400">
                        <i class="fa-solid fa-book-open-reader text-6xl mb-4 opacity-50"></i>
                        <p class="text-lg font-bold text-custom-purple-600" id="library-empty-msg">此分類尚未有書籍</p>
                        <p class="text-sm mt-1">點擊右下角「+」號加入小說吧！</p>
                    </div>
                </div>

                <!-- 視圖 3: 新增/編輯小說表單 (Add Novel) -->
                <div id="view-novel-form" class="view-section hidden max-w-2xl mx-auto pb-10">
                    <div class="bg-white rounded-3xl shadow-sm border border-custom-purple-100 p-6 md:p-8">
                        <h2 id="novel-form-title" class="text-xl font-bold text-custom-purple-800 mb-6 flex items-center gap-2 border-b border-custom-purple-50 pb-4">
                            <i class="fa-solid fa-book-medical text-custom-purple-500"></i> 設定小說資訊
                        </h2>
                        
                        <div class="space-y-5">
                            <div class="flex flex-col sm:flex-row gap-6">
                                <div class="shrink-0 flex flex-col items-center gap-2">
                                    <label class="text-sm font-bold text-custom-purple-600">小說封面 (選填)</label>
                                    <div class="relative w-28 h-40 group rounded-xl overflow-hidden bg-custom-purple-50 border-2 border-dashed border-custom-purple-300 hover:border-custom-purple-500 transition-colors flex items-center justify-center cursor-pointer">
                                        <input type="file" id="novel-cover-input" accept="image/*" class="absolute inset-0 opacity-0 z-10 cursor-pointer">
                                        <img id="novel-cover-preview" src="" class="hidden absolute inset-0 w-full h-full object-cover">
                                        <div class="text-custom-purple-400 flex flex-col items-center gap-1">
                                            <i class="fa-solid fa-image text-2xl"></i>
                                            <span class="text-xs font-bold">點擊上傳</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="flex-1 space-y-4">
                                    <div>
                                        <label class="block text-sm font-bold text-custom-purple-600 mb-1">書名 <span class="text-red-500">*</span></label>
                                        <input type="text" id="novel-title" required class="w-full p-3 bg-custom-purple-50 rounded-xl border border-custom-purple-200 focus:ring-2 focus:ring-custom-purple-400 outline-none font-bold text-custom-purple-800">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-custom-purple-600 mb-1">作者 (選填)</label>
                                        <input type="text" id="novel-author" class="w-full p-3 bg-custom-purple-50 rounded-xl border border-custom-purple-200 focus:ring-2 focus:ring-custom-purple-400 outline-none text-custom-purple-800">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-custom-purple-600 mb-1">分類歸屬 <span class="text-red-500">*</span></label>
                                        <select id="novel-category" class="w-full p-3 bg-custom-purple-50 rounded-xl border border-custom-purple-200 focus:ring-2 focus:ring-custom-purple-400 outline-none font-bold text-custom-purple-800 appearance-none cursor-pointer">
                                            <!-- 動態載入自定義分類 -->
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm font-bold text-custom-purple-600 mb-1">來源網址 (選填)</label>
                                        <input type="text" id="novel-url" placeholder="例如：https://..." class="w-full p-3 bg-custom-purple-50 rounded-xl border border-custom-purple-200 focus:ring-2 focus:ring-custom-purple-400 outline-none text-custom-purple-800">
                                    </div>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-bold text-custom-purple-600 mb-1">簡介 (選填)</label>
                                <textarea id="novel-desc" rows="4" class="w-full p-3 bg-custom-purple-50 rounded-xl border border-custom-purple-200 focus:ring-2 focus:ring-custom-purple-400 outline-none resize-y text-sm text-slate-600"></textarea>
                            </div>
                            
                            <button id="btn-save-novel" class="w-full bg-custom-purple-600 hover:bg-custom-purple-700 text-white font-bold py-3.5 rounded-xl shadow-md active:scale-95 transition-all">
                                儲存小說設定
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 視圖 4: 小說目錄與詳情 (Novel Detail / Chapters) -->
                <div id="view-novel-detail" class="view-section hidden w-full max-w-5xl mx-auto pb-10">
                    <div class="bg-white rounded-3xl shadow-sm border border-custom-purple-100 p-5 md:p-6 mb-6 flex gap-4 md:gap-6 items-start relative overflow-hidden">
                        <div class="absolute -right-20 -top-20 w-64 h-64 bg-custom-purple-100 rounded-full opacity-50 blur-3xl pointer-events-none"></div>
                        
                        <div class="w-32 h-48 md:w-40 md:h-60 shrink-0 rounded-lg overflow-hidden shadow-lg bg-custom-purple-200 flex items-center justify-center border border-custom-purple-300 z-10 animate-fade-in-up">
                            <img id="detail-cover" src="" class="w-full h-full object-cover hidden">
                            <i id="detail-cover-icon" class="fa-solid fa-book-open text-custom-purple-400 text-4xl md:text-5xl"></i>
                        </div>
                        
                        <div class="flex-1 z-10 flex flex-col min-h-[12rem] md:min-h-[15rem]">
                            <div class="flex items-center gap-2 mb-1">
                                <span id="detail-category" class="bg-custom-purple-100 text-custom-purple-700 text-[10px] font-bold px-2 py-0.5 rounded-full">分類</span>
                            </div>
                            <h2 id="detail-title" class="text-xl md:text-2xl font-black text-custom-purple-900 mb-1 leading-tight line-clamp-2">小說書名</h2>
                            <p id="detail-author" class="text-xs md:text-sm font-bold text-custom-purple-500 mb-2">作者名字</p>
                            <p id="detail-desc" class="text-xs text-slate-600 line-clamp-3 leading-relaxed mb-4">簡介內容...</p>
                            
                            <div class="flex flex-col gap-2 mt-auto w-full max-w-[160px] md:max-w-[200px]">
                                <button onclick="window.app.continueReading()" class="bg-custom-purple-600 hover:bg-custom-purple-700 text-white py-1.5 px-3 rounded-lg text-[11px] md:text-xs font-bold shadow transition-colors flex items-center justify-center gap-1.5 w-full shrink-0">
                                    <i class="fa-solid fa-book-open-reader"></i> 繼續閱讀
                                </button>
                                <a id="detail-url-btn" href="#" target="_blank" rel="noopener noreferrer" class="hidden bg-custom-purple-100 hover:bg-custom-purple-200 text-custom-purple-700 py-1.5 px-3 rounded-lg text-[11px] md:text-xs font-bold shadow-sm transition-colors flex items-center justify-center gap-1.5 w-full shrink-0">
                                    <i class="fa-solid fa-link"></i> 原文連結
                                </a>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-3xl shadow-sm border border-custom-purple-100 p-5 md:p-8">
                        <div class="flex justify-between items-center mb-6 border-b border-custom-purple-50 pb-4">
                            <h3 class="text-lg font-bold text-custom-purple-800 flex items-center gap-2"><i class="fa-solid fa-list-ul text-custom-purple-500"></i> 目錄章節</h3>

    <!-- ==========================================

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, inMemoryPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, onSnapshot, addDoc, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKVLVYRGvsiuFmQIXuFCU9O2TBVVRb3gk",
            authDomain: "popcorn-ee2cc.firebaseapp.com",
            projectId: "popcorn-ee2cc",
            storageBucket: "popcorn-ee2cc.firebasestorage.app",
            messagingSenderId: "1095484888994",
            appId: "1:1095484888994:web:3d39b271a04d0935b0c4fb"
        };
        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);
        const APP_ID = 'novel-reader-app';

        window.app = {
            currentUser: null,
            profile: { nickname: '', avatar: null, dashboardBg: null, categories: [] },
            novels: [], chapters: [], 
            currentNovelId: null, currentChapterId: null, currentCategory: '未分類',
            novelDetailReturnView: 'categories',
            currentLibraryMode: 'category', 
            selectedDashboardCategory: null,
            categoryDeleteMode: false,
            categoryEditMode: false,
            editingChapterId: null, 
            isSortingMode: false, 
            readerSettings: { fontSize: 18, theme: 'light' },
            unsubNovels: null, unsubChapters: null, unsubProfile: null,
            
            searchQueryLibrary: '',
            searchQueryDashboard: '',
            pendingDeleteAction: null,
            categoryModalMode: 'add', 
            editingCategoryName: '',
            isCategoryFromSelect: false
        };

        let tempNovelCover = null;

        // Alert
        window.app.showAlert = (message, type = 'error') => {
            const titleEl = document.getElementById('alert-title');
            const msgEl = document.getElementById('alert-msg');
            const iconCont = document.getElementById('alert-icon-container');
            const icon = document.getElementById('alert-icon');
            window.app.closeAllSwipes(); 
            msgEl.textContent = message;
            if (type === 'error') {
                titleEl.textContent = "操作失敗"; iconCont.className = "w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border border-red-100"; icon.className = "fa-solid fa-triangle-exclamation";
            } else {
                titleEl.textContent = "系統提示"; iconCont.className = "w-16 h-16 bg-custom-purple-50 text-custom-purple-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border border-custom-purple-100"; icon.className = "fa-solid fa-circle-info";
            }
            document.getElementById('alert-modal').classList.remove('hidden');
        };

        // Swipe Manager
        window.swipeState = { activeContainer: null };
        window.app.closeAllSwipes = () => { if (window.swipeState.activeContainer) { window.swipeState.activeContainer.querySelector('.swipe-content').style.transform = 'translateX(0)'; window.swipeState.activeContainer = null; } };

        function initSwipe() {
            document.querySelectorAll('.swipe-container').forEach(container => {
                if (container.dataset.swipeInitialized) return;
                container.dataset.swipeInitialized = 'true';

                const content = container.querySelector('.swipe-content');
                if (!content) return;
                
                const hasLeftActions = container.querySelector('.swipe-actions-left') !== null;
                const hasRightActions = container.querySelector('.swipe-actions-right') !== null;
                
                let startX = 0, currentX = 0, isDragging = false, isMoved = false;

                const startDrag = (e) => {
                    if (e.target.closest('button')) return; 
                    startX = e.type.includes('mouse') ? e.pageX : e.touches[0].clientX;
                    isDragging = true; isMoved = false; content.style.transition = 'none';
                    if (window.swipeState.activeContainer && window.swipeState.activeContainer !== container) { window.app.closeAllSwipes(); }
                };

                const drag = (e) => {
                    if (!isDragging) return;
                    currentX = (e.type.includes('mouse') ? e.pageX : e.touches[0].clientX) - startX;
                    if (Math.abs(currentX) > 10) isMoved = true;
                    if (currentX < 0 && hasRightActions && currentX > -85) { content.style.transform = `translateX(${currentX}px)`; } 
                    else if (currentX > 0 && hasLeftActions && currentX < 85) { content.style.transform = `translateX(${currentX}px)`; }
                };

                const endDrag = (e) => {
                    if (!isDragging) return;
                    isDragging = false; content.style.transition = 'transform 0.3s ease-out';
                    if (currentX < -40 && hasRightActions) { content.style.transform = `translateX(-70px)`; window.swipeState.activeContainer = container; } 
                    else if (currentX > 40 && hasLeftActions) { content.style.transform = `translateX(70px)`; window.swipeState.activeContainer = container; } 
                    else { content.style.transform = `translateX(0)`; if (window.swipeState.activeContainer === container) window.swipeState.activeContainer = null; }
                    setTimeout(() => { isMoved = false; currentX = 0; }, 100);
                };

                container.addEventListener('touchstart', startDrag, {passive: true}); container.addEventListener('touchmove', drag, {passive: true}); container.addEventListener('touchend', endDrag);
                container.addEventListener('mousedown', startDrag); container.addEventListener('mousemove', drag); container.addEventListener('mouseup', endDrag); container.addEventListener('mouseleave', endDrag);

                content.addEventListener('click', (e) => {
                    if (isMoved || window.swipeState.activeContainer === container) {
                        e.preventDefault(); e.stopPropagation();
                        if (!isMoved && window.swipeState.activeContainer === container) { window.app.closeAllSwipes(); }
                    }
                }, true);
            });
        }

        // 刪除確認 Modal
        window.app.showDeleteConfirm = (title, message, actionFn) => {
            window.app.closeAllSwipes();
            document.getElementById('delete-modal-title').textContent = title; document.getElementById('delete-modal-msg').textContent = message;
            window.app.pendingDeleteAction = actionFn;
            document.getElementById('delete-confirm-modal').classList.remove('hidden');
        };
        window.app.cancelDelete = () => { window.app.pendingDeleteAction = null; document.getElementById('delete-confirm-modal').classList.add('hidden'); if (window.app.categoryDeleteMode) { window.app.categoryDeleteMode = false; if (!document.getElementById('view-categories').classList.contains('hidden')) renderCategoriesDashboard(); } };
        window.app.confirmDelete = async () => { if (window.app.pendingDeleteAction) await window.app.pendingDeleteAction(); window.app.cancelDelete(); };

        // 搜尋
        window.app.toggleSearch = () => {
            const container = document.getElementById('search-bar-container'); container.classList.toggle('hidden');
            if (!container.classList.contains('hidden')) { document.getElementById('search-input').focus(); } 
            else { document.getElementById('search-input').value = ''; window.app.handleSearch(''); }
        };
        window.app.handleSearch = (val) => { 
            window.app.searchQueryDashboard = val.trim().toLowerCase(); 
            renderCategoriesDashboard(); 
        };

        window.app.toggleSearchLibrary = () => {
            const container = document.getElementById('search-bar-container-library'); container.classList.toggle('hidden');
            if (!container.classList.contains('hidden')) { document.getElementById('search-input-library').focus(); } 
            else { document.getElementById('search-input-library').value = ''; window.app.handleSearchLibrary(''); }
        };
        window.app.handleSearchLibrary = (val) => { 
            window.app.searchQueryLibrary = val.trim().toLowerCase(); 
            renderLibrary(); 
        };

        // 視圖路由
        window.app.switchView = (viewName) => {
            const views = ['categories', 'library', 'novel-form', 'novel-detail', 'chapter-form', 'reader'];
            views.forEach(v => document.getElementById(`view-${v}`).classList.add('hidden'));
            const fab = document.getElementById('btn-fab-add'), btnBack = document.getElementById('btn-back');
            const headerTitle = document.getElementById('header-title');
            
            const mainScrollArea = document.getElementById('main-scroll-area');
            mainScrollArea.scrollTop = 0;
            mainScrollArea.classList.add('overflow-y-auto');
            mainScrollArea.classList.remove('overflow-y-hidden');
            document.getElementById(`view-${viewName}`).classList.remove('hidden');
            window.app.closeAllSwipes();
            window.app.isSortingMode = false;

            switch(viewName) {
                case 'categories': 
                    fab.classList.remove('hidden'); btnBack.classList.add('hidden'); 
                    headerTitle.textContent = "Moonlight_童話鎮";
                    break;
                case 'library': 
                    fab.classList.remove('hidden'); btnBack.classList.remove('hidden'); btnBack.onclick = () => window.app.switchView('categories'); 
                    headerTitle.textContent = window.app.currentCategory;
                    renderLibrary(); 
                    break;
                case 'novel-form': 
                    fab.classList.add('hidden'); btnBack.classList.remove('hidden'); 
                    btnBack.onclick = () => { 
                        if(window.app.currentLibraryMode === 'category' && window.app.currentCategory && window.app.currentCategory !== '未分類') window.app.switchView('library'); 
                        else window.app.switchView('categories'); 
                    }; 
                    renderCategoryDropdown(); 
                    break;
                case 'novel-detail': 
                    fab.classList.add('hidden'); btnBack.classList.remove('hidden'); btnBack.onclick = () => window.app.switchView(window.app.novelDetailReturnView || 'categories'); break;
                case 'chapter-form': 
                    fab.classList.add('hidden'); btnBack.classList.remove('hidden'); btnBack.onclick = () => window.app.switchView('novel-detail'); break;
                case 'reader': 
                    fab.classList.add('hidden'); btnBack.classList.remove('hidden'); btnBack.onclick = () => window.app.switchView('novel-detail'); break;
            }
            setTimeout(initSwipe, 100);
        };

        // 認證
        const authCont = document.getElementById('auth-container'), appCont = document.getElementById('app-container');
        const loginErr = document.getElementById('login-error'), regErr = document.getElementById('reg-error');
        // 每次重新整理網頁都要求重新登入；登入狀態只保留在目前頁面工作階段。
        // 先等待 Firebase 設定完成，再監聽登入狀態，避免登入頁閃現後又消失。
        await setPersistence(auth, inMemoryPersistence);

        document.getElementById('login-form').addEventListener('submit', async (e) => { e.preventDefault(); try { await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value); loginErr.classList.add('hidden'); } catch (err) { loginErr.textContent = "登入失敗，帳號或密碼錯誤"; loginErr.classList.remove('hidden', 'text-green-600'); loginErr.classList.add('text-red-500'); } });
        document.getElementById('btn-modal-logout').addEventListener('click', async () => { await signOut(auth); document.getElementById('profile-modal').classList.add('hidden'); });

        // 資料庫監聽
        function initDataListeners(uid) {
            window.app.unsubProfile = onSnapshot(doc(db, 'artifacts', APP_ID, 'users', uid, 'profile', 'data'), (d) => {
                let pData = { categories: ['未分類'] }; 
                if (d.exists() && d.data()) { pData = { ...pData, ...d.data() }; }
                if (!Array.isArray(pData.categories) || pData.categories.length === 0) { pData.categories = ['未分類']; setDoc(doc(db, 'artifacts', APP_ID, 'users', uid, 'profile', 'data'), { categories: pData.categories }, { merge: true }); }
                
                window.app.profile = pData;
                
                document.getElementById('header-nickname').textContent = window.app.profile.nickname || '未命名讀者';
                if (window.app.profile.avatar) { document.getElementById('header-avatar').src = window.app.profile.avatar; document.getElementById('header-avatar').classList.remove('hidden'); document.getElementById('header-avatar-icon').classList.add('hidden'); }
                const bgLayer = document.getElementById('dashboard-bg-layer');
                if (window.app.profile.dashboardBg) { bgLayer.style.backgroundImage = `url(${window.app.profile.dashboardBg})`; bgLayer.classList.replace('opacity-0', 'opacity-100'); } else { bgLayer.style.backgroundImage = ''; bgLayer.classList.replace('opacity-100', 'opacity-0'); }
                
                renderCategoriesDashboard();
            }, e => { console.error(e); window.app.showAlert("讀取設定失敗，請重新載入。", "error"); });

            window.app.unsubNovels = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', uid, 'novels'), (snap) => {
                window.app.novels = []; snap.forEach(d => window.app.novels.push({ id: d.id, ...d.data() })); window.app.novels.sort((a,b) => b.createdAt - a.createdAt); 
                
                renderCategoriesDashboard(); 
                renderLibrary(); 
            }, e => { console.error(e); window.app.showAlert("讀取書架失敗，可能是 Firebase 權限問題。", "error"); });
        }

        // 儀表板
        function renderCategoriesDashboard() {
            let profileCats = window.app.profile.categories;
            if(!profileCats || !Array.isArray(profileCats)) profileCats = ['未分類'];

            const total = window.app.novels.length, liked = window.app.novels.filter(n => n.isLiked).length, favorited = window.app.novels.filter(n => n.isFavorited).length;
            document.getElementById('stat-total-books').textContent = total; document.getElementById('stat-liked-books').textContent = liked; document.getElementById('stat-favorited-books').textContent = favorited;

            const allCats = new Set(profileCats);
            window.app.novels.forEach(n => { if (n.category) allCats.add(n.category); else allCats.add('未分類'); });
            
            const queryText = window.app.searchQueryDashboard || '';
            const displayCategories = Array.from(allCats).filter(cat => {
                if(!queryText) return true;
                if(cat.toLowerCase().includes(queryText)) return true;
                return window.app.novels.some(n => (n.category || '未分類') === cat && (n.title.toLowerCase().includes(queryText) || (n.author && n.author.toLowerCase().includes(queryText))));
            });

            if (!displayCategories.length) {
                window.app.selectedDashboardCategory = null;
            } else if (!displayCategories.includes(window.app.selectedDashboardCategory)) {
                window.app.selectedDashboardCategory = displayCategories[0];
            }

            const categoryButtons = displayCategories.map(cat => {
                const count = window.app.novels.filter(n => (n.category || '未分類') === cat).length;
                const active = window.app.selectedDashboardCategory === cat;
                const deleteMode = window.app.categoryDeleteMode;
                const editMode = window.app.categoryEditMode;
                return `
                <div class="shrink-0 snap-start">
                    <button type="button" data-cat="${escapeHTML(cat)}" onclick="window.app.onDashboardCategoryClick(this.getAttribute('data-cat'))"
                        class="px-4 py-2 rounded-full border text-xs sm:text-sm font-bold whitespace-nowrap transition-all ${deleteMode ? 'border-red-300 bg-red-50 text-red-600 ring-1 ring-red-200' : active ? 'bg-custom-purple-600 text-white border-custom-purple-600 shadow-md' : 'bg-white text-custom-purple-700 border-custom-purple-200 hover:bg-custom-purple-50'}">
                        ${deleteMode ? '<i class="fa-solid fa-circle-minus mr-1"></i>' : editMode ? '<i class="fa-solid fa-pen mr-1 text-[10px]"></i>' : ''}${escapeHTML(cat)} <span class="ml-1 ${active && !deleteMode ? 'text-custom-purple-100' : 'text-custom-purple-400'}">${count}</span>
                    </button>
                </div>`;
            }).join('');
            const managementButtons = `
                <div class="flex items-center gap-1 pl-2 ml-1 border-l border-custom-purple-200 shrink-0">
                    ${window.app.categoryEditMode ? '<button type="button" onclick="window.app.openCategoryModal(\'add\')" aria-label="新增合集" title="新增合集" class="w-9 h-9 rounded-full bg-custom-purple-600 text-white hover:bg-custom-purple-700 flex items-center justify-center shrink-0"><i class="fa-solid fa-plus"></i></button>' : ''}
                    <button type="button" onclick="window.app.openCategoryManager()" aria-label="編輯或新增合集" title="編輯／新增合集" class="w-9 h-9 rounded-full bg-custom-purple-100 text-custom-purple-700 hover:bg-custom-purple-200 flex items-center justify-center shrink-0"><i class="fa-solid fa-pen"></i></button>
                    <button type="button" onclick="window.app.toggleCategoryDeleteMode()" aria-label="刪除合集" title="刪除合集" class="w-9 h-9 rounded-full ${window.app.categoryDeleteMode ? 'bg-red-500 text-white' : 'bg-red-50 text-red-400 hover:bg-red-100'} flex items-center justify-center shrink-0"><i class="fa-solid ${window.app.categoryDeleteMode ? 'fa-xmark' : 'fa-trash'}"></i></button>
                </div>`;
            document.getElementById('categories-grid').innerHTML = categoryButtons + managementButtons;

            renderDashboardBooks();
            setTimeout(initSwipe, 50);
        }

        window.app.selectDashboardCategory = (category) => {
            window.app.selectedDashboardCategory = category;
            renderCategoriesDashboard();
            const activeButton = Array.from(document.querySelectorAll('#categories-grid button[data-cat]')).find(btn => btn.getAttribute('data-cat') === category);
            if (activeButton) activeButton.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        };
        window.app.onDashboardCategoryClick = (category) => {
            if (window.app.categoryEditMode) {
                window.app.openCategoryModal('edit', false, category);
                return;
            }
            if (window.app.categoryDeleteMode) {
                window.app.deleteCategory(null, category);
                return;
            }
            window.app.selectDashboardCategory(category);
        };
        window.app.openCategoryManager = () => {
            window.app.categoryDeleteMode = false;
            window.app.categoryEditMode = !window.app.categoryEditMode;
            renderCategoriesDashboard();
            if (window.app.categoryEditMode) window.app.showAlert('點選想修改名稱的合集；按右側「＋」可以新增合集。', 'info');
        };
        window.app.toggleCategoryDeleteMode = () => {
            window.app.categoryEditMode = false;
            window.app.categoryDeleteMode = !window.app.categoryDeleteMode;
            renderCategoriesDashboard();
            if (window.app.categoryDeleteMode) window.app.showAlert('請點選想刪除的合集；再次點擊垃圾桶可取消。', 'info');

        function renderDashboardBooks() {
            const category = window.app.selectedDashboardCategory;
            const grid = document.getElementById('dashboard-books-grid');
            const title = document.getElementById('dashboard-books-title');
            const countEl = document.getElementById('dashboard-books-count');

                title.textContent = '尚無符合的合集'; countEl.textContent = '0 本書';

            let books = window.app.novels.filter(n => (n.category || '未分類') === category);
            const query = window.app.searchQueryDashboard || '';
            if (query) books = books.filter(n => n.title.toLowerCase().includes(query) || (n.author && n.author.toLowerCase().includes(query)) || category.toLowerCase().includes(query));

                        <button data-id="${n.id}" onclick="window.app.deleteNovel(event, this.getAttribute('data-id'))" class="w-9 h-9 bg-red-400 hover:bg-red-500 text-white rounded-full flex items-center justify-center shadow"><i class="fa-solid fa-trash"></i></button>
                    </div>
                    <div class="swipe-content w-full h-full bg-[#f8fafc] flex flex-col gap-1 cursor-pointer z-10 p-2 border border-custom-purple-100 rounded-xl" onclick="window.app.openNovelDetail('${n.id}')">
                        <div class="w-full flex-1 bg-custom-purple-200 rounded-xl overflow-hidden shadow-sm border border-custom-purple-300 relative">

                            <div class="absolute top-2 right-2 flex flex-col gap-2 z-20">

                                <button onclick="window.app.toggleNovelState(event, '${n.id}', 'isFavorited')" class="w-6 h-6 rounded-full bg-white/90 shadow flex items-center justify-center"><i class="${n.isFavorited ? 'fa-solid text-yellow-500' : 'fa-regular text-slate-400'} fa-bookmark text-xs"></i></button>
                            </div>
                        </div>
                        <div class="px-1 mt-1 shrink-0 h-10">
                            <h3 class="font-bold text-custom-purple-900 text-sm leading-tight line-clamp-1">${escapeHTML(n.title)}</h3>
                            <p class="text-[10px] text-custom-purple-500 font-bold mt-0.5 truncate">${escapeHTML(n.author || '未知作者')}</p>
                        </div>
                    </div>
                </div>`).join('');
        }

        window.app.openLibrary = (mode, param = null) => {
            window.app.currentLibraryMode = mode;
            window.app.searchQueryLibrary = '';
            document.getElementById('search-bar-container-library').classList.add('hidden');
            document.getElementById('search-input-library').value = '';

            if (mode === 'category') {
                window.app.currentCategory = param;
                document.getElementById('current-category-display').textContent = param;
            } else if (mode === 'liked') {
                document.getElementById('current-category-display').textContent = "喜歡的書";

                document.getElementById('current-category-display').textContent = "收藏的書";
            }
            
            renderLibrary();
            window.app.switchView('library');
        };

        window.app.openCategoryModal = (mode, fromSelect = false, catName = '') => { window.app.categoryModalMode = mode; window.app.isCategoryFromSelect = fromSelect; window.app.editingCategoryName = catName; const input = document.getElementById('input-new-category'), title = document.getElementById('category-modal-title'); if (mode === 'add') { title.innerHTML = `<i class="fa-solid fa-folder-plus text-custom-purple-500"></i> 新增自訂分類`; input.value = ''; } else { title.innerHTML = `<i class="fa-solid fa-pen text-custom-purple-500"></i> 編輯分類名稱`; input.value = catName; } document.getElementById('category-modal').classList.remove('hidden'); };
        document.getElementById('btn-confirm-category').addEventListener('click', async () => {
            const newName = document.getElementById('input-new-category').value.trim(); if(!newName) return; const currentCats = window.app.profile.categories || [];
            if (window.app.categoryModalMode === 'add') { if(currentCats.includes(newName)) return window.app.showAlert('這個分類已經存在囉！', 'info'); currentCats.push(newName); } 
            else { if(newName === window.app.editingCategoryName) return document.getElementById('category-modal').classList.add('hidden'); if(currentCats.includes(newName)) return window.app.showAlert('名稱與其他分類重複！'); if (window.app.selectedDashboardCategory === window.app.editingCategoryName) window.app.selectedDashboardCategory = newName; const idx = currentCats.indexOf(window.app.editingCategoryName); if (idx !== -1) currentCats[idx] = newName; window.app.novels.filter(n => (n.category || '未分類') === window.app.editingCategoryName).forEach(async n => { try { await updateDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', n.id), { category: newName }); } catch(e){} }); }
            try { await setDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'profile', 'data'), { categories: currentCats }, { merge: true }); document.getElementById('category-modal').classList.add('hidden'); window.app.categoryEditMode = false; renderCategoriesDashboard(); if (window.app.isCategoryFromSelect && window.app.categoryModalMode === 'add') { setTimeout(() => { renderCategoryDropdown(); document.getElementById('novel-category').value = newName; }, 100); } } catch(e) { window.app.showAlert("儲存分類失敗"); }
        });

        window.app.deleteCategory = (e, cat) => {
            if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
            if(cat === '未分類') return window.app.showAlert("系統預設的「未分類」無法刪除。");
            const count = window.app.novels.filter(n => (n.category || '未分類') === cat).length;

            if (window.app.currentLibraryMode === 'category') {

                filteredNovels = window.app.novels.filter(n => n.isLiked);
            } else if (window.app.currentLibraryMode === 'favorited') {
                filteredNovels = window.app.novels.filter(n => n.isFavorited);
            }

            const queryText = window.app.searchQueryLibrary || ''; 
            if (queryText) { filteredNovels = filteredNovels.filter(n => n.title.toLowerCase().includes(queryText) || (n.author && n.author.toLowerCase().includes(queryText))); }

                grid.innerHTML = filteredNovels.map(n => `
                    <div class="swipe-container rounded-xl w-full group overflow-visible bg-custom-purple-50 aspect-[2/3]">
                        <div class="swipe-actions-right rounded-xl pr-3">
                            <button data-id="${n.id}" onclick="window.app.editNovel(event, this.getAttribute('data-id'))" class="w-10 h-10 bg-custom-purple-400 hover:bg-custom-purple-500 text-white rounded-full flex items-center justify-center transition-colors shadow"><i class="fa-solid fa-pen"></i></button>
                            <button data-id="${n.id}" onclick="window.app.deleteNovel(event, this.getAttribute('data-id'))" class="w-10 h-10 bg-red-400 hover:bg-red-500 text-white rounded-full flex items-center justify-center transition-colors shadow"><i class="fa-solid fa-trash"></i></button>
                        </div>

                                ${n.cover ? `<img src="${n.cover}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-custom-purple-400 opacity-50"><i class="fa-solid fa-book text-4xl"></i></div>`}

                                    <button onclick="window.app.toggleNovelState(event, '${n.id}', 'isFavorited')" class="w-6 h-6 md:w-8 md:h-8 rounded-full bg-white/90 backdrop-blur shadow flex items-center justify-center hover:scale-110 transition-transform" title="${n.isFavorited ? '取消收藏' : '加入收藏'}"><i class="${n.isFavorited ? 'fa-solid text-yellow-500' : 'fa-regular text-slate-400 hover:text-yellow-400'} fa-bookmark text-xs md:text-sm"></i></button>
                                </div>
                            </div>
                            <div class="px-1 mt-1 shrink-0 h-10">
                                <h3 class="font-bold text-custom-purple-900 text-sm leading-tight line-clamp-1" title="${escapeHTML(n.title)}">${escapeHTML(n.title)}</h3>

        window.app.toggleNovelState = async (e, novelId, field) => { 
            e.stopPropagation(); 
            if(!window.app.currentUser) return; 
            const novel = window.app.novels.find(n => n.id === novelId); 
            if(!novel) return; 
            try { 
                await updateDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', novelId), { [field]: !novel[field] }); 
            } catch(err) { window.app.showAlert("狀態切換失敗"); } 
        };
        
        window.app.openNovelForm = (novelId = null) => {
            if (novelId) { 
                const n = window.app.novels.find(x => x.id === novelId); if (!n) return; window.app.currentNovelId = n.id; 
                document.getElementById('novel-form-title').innerHTML = `<i class="fa-solid fa-pen text-custom-purple-500"></i> 編輯小說資訊`; 
                document.getElementById('novel-title').value = n.title || ''; document.getElementById('novel-author').value = n.author || ''; document.getElementById('novel-desc').value = n.description || ''; 
                document.getElementById('novel-url').value = n.sourceUrl || ''; 
                tempNovelCover = n.cover || null; 
                if (n.cover) { document.getElementById('novel-cover-preview').src = n.cover; document.getElementById('novel-cover-preview').classList.remove('hidden'); } else { document.getElementById('novel-cover-preview').classList.add('hidden'); }
