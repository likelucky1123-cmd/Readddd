                window.app.currentNovelId = null; 
                document.getElementById('novel-form-title').innerHTML = `<i class="fa-solid fa-book-medical text-custom-purple-500"></i> 新增小說資訊`; 
                document.getElementById('novel-title').value = ''; document.getElementById('novel-author').value = ''; document.getElementById('novel-desc').value = ''; 
                document.getElementById('novel-url').value = ''; 
                tempNovelCover = null; document.getElementById('novel-cover-preview').classList.add('hidden'); document.getElementById('novel-cover-input').value = ''; 
            }
            window.app.switchView('novel-form');
        }
        
        window.app.editNovel = (e, novelId) => { e.stopPropagation(); window.app.openNovelForm(novelId); };
        window.app.deleteNovel = (e, novelId) => {
            e.stopPropagation();
            const n = window.app.novels.find(x => x.id === novelId);
            if (!n || !window.app.currentUser) return;
            window.app.showDeleteConfirm(`刪除《${n.title}》？`, "將會永久移除這本書的所有設定與章節！", async () => {
                try {
                    const chaptersRef = collection(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', novelId, 'chapters');
                    const chapterSnapshot = await getDocs(chaptersRef);
                    // Firestore does not cascade-delete subcollections automatically.
                    for (let i = 0; i < chapterSnapshot.docs.length; i += 400) {
                        await Promise.all(chapterSnapshot.docs.slice(i, i + 400).map(chapterDoc => deleteDoc(chapterDoc.ref)));
                    }
                    if (window.app.currentNovelId === novelId && window.app.unsubChapters) {
                        window.app.unsubChapters(); window.app.unsubChapters = null;
                    }
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', novelId));
                    if (window.app.currentNovelId === novelId) window.app.currentNovelId = null;
                } catch(err) {
                    console.error('刪除小說或章節失敗：', err);
                    window.app.showAlert("刪除失敗，請確認 Firebase 權限後再試。");
                }
            });
        };

        function renderCategoryDropdown() { const select = document.getElementById('novel-category'); const allCats = new Set(window.app.profile.categories || ['未分類']); window.app.novels.forEach(n => { if (n.category) allCats.add(n.category); else allCats.add('未分類'); }); let html = Array.from(allCats).map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join(''); html += `<option value="_ADD_NEW_" class="font-bold text-custom-purple-600 bg-custom-purple-100">+ 新增自訂分類</option>`; select.innerHTML = html; if(window.app.currentCategory && Array.from(allCats).includes(window.app.currentCategory)) { select.value = window.app.currentCategory; } }
        document.getElementById('novel-category').addEventListener('change', (e) => { if (e.target.value === '_ADD_NEW_') { window.app.openCategoryModal('add', true); e.target.value = window.app.currentCategory || '未分類'; } });
        function compressImg(file, maxDimension) {
            return new Promise((resolve, reject) => {
                if (!file || !file.type || !file.type.startsWith('image/')) return reject(new Error('請選擇圖片檔案。'));
                if (file.size > 12 * 1024 * 1024) return reject(new Error('原始圖片請小於 12 MB。'));
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('讀取圖片失敗，請換一張圖片再試。'));
                reader.onload = event => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('無法辨識這張圖片。'));
                    img.onload = () => {
                        let width = img.naturalWidth, height = img.naturalHeight;
                        const scale = Math.min(1, maxDimension / Math.max(width, height));
                        width = Math.max(1, Math.round(width * scale));
                        height = Math.max(1, Math.round(height * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = width; canvas.height = height;
                        const context = canvas.getContext('2d');
                        if (!context) return reject(new Error('圖片處理功能無法啟動。'));
                        context.drawImage(img, 0, 0, width, height);
                        // Firestore documents have a 1 MiB limit. Keep image data safely below it.
                        let quality = 0.78;
                        let dataUrl = canvas.toDataURL('image/jpeg', quality);
                        while (dataUrl.length > 700 * 1024 && quality > 0.42) {
                            quality -= 0.08;
                            dataUrl = canvas.toDataURL('image/jpeg', quality);
                        }
                        if (dataUrl.length > 700 * 1024) return reject(new Error('圖片仍然太大，請改用較小的圖片。'));
                        resolve(dataUrl);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }
        document.getElementById('novel-cover-input').addEventListener('change', async (e) => {
            if (!e.target.files[0]) return;
            try { tempNovelCover = await compressImg(e.target.files[0], 600); document.getElementById('novel-cover-preview').src = tempNovelCover; document.getElementById('novel-cover-preview').classList.remove('hidden'); }
            catch (err) { window.app.showAlert(err.message || '圖片處理失敗'); e.target.value = ''; }
        });
        
        document.getElementById('btn-save-novel').addEventListener('click', async () => { 
            const title = document.getElementById('novel-title').value.trim(); 
            if (!title) return window.app.showAlert("請輸入書名！", "info"); 
            const btn = document.getElementById('btn-save-novel'); btn.textContent = "儲存中..."; 
            
            let sourceUrl = document.getElementById('novel-url').value.trim();
            if (sourceUrl && !/^https?:\/\//i.test(sourceUrl)) { sourceUrl = 'http://' + sourceUrl; }

            const novelData = { title, author: document.getElementById('novel-author').value.trim(), category: document.getElementById('novel-category').value, description: document.getElementById('novel-desc').value.trim(), sourceUrl: sourceUrl, cover: tempNovelCover, updatedAt: Date.now() }; 
            
            try { 
                if (window.app.currentNovelId) { await updateDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', window.app.currentNovelId), novelData); } 
                else { novelData.createdAt = Date.now(); novelData.isLiked = false; novelData.isFavorited = false; await addDoc(collection(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels'), novelData); } 
                window.app.currentCategory = novelData.category; window.app.currentLibraryMode = 'category'; window.app.switchView('library'); 
            } catch(e) { window.app.showAlert("儲存失敗"); } finally { btn.textContent = "儲存小說設定"; } 
        });

        // ==========================================
        // 視圖 4: 目錄與章節邏輯
        // ==========================================
        window.app.openNovelDetail = (novelId) => {
            const activeView = document.querySelector('.view-section:not(.hidden)');
            if (activeView && ['categories', 'library'].includes(activeView.id.replace('view-', ''))) {
                window.app.novelDetailReturnView = activeView.id.replace('view-', '');
            }
            window.app.currentNovelId = novelId; const novel = window.app.novels.find(n => n.id === novelId); if(!novel) return;
            document.getElementById('detail-title').textContent = novel.title; document.getElementById('detail-author').textContent = novel.author || '未知作者'; document.getElementById('detail-category').textContent = novel.category || '未分類'; document.getElementById('detail-desc').textContent = novel.description || '暫無簡介';
            if (novel.cover) { document.getElementById('detail-cover').src = novel.cover; document.getElementById('detail-cover').classList.remove('hidden'); document.getElementById('detail-cover-icon').classList.add('hidden'); } else { document.getElementById('detail-cover').classList.add('hidden'); document.getElementById('detail-cover-icon').classList.remove('hidden'); }

            const urlBtn = document.getElementById('detail-url-btn');
            if (novel.sourceUrl) { urlBtn.href = novel.sourceUrl; urlBtn.classList.remove('hidden'); } else { urlBtn.classList.add('hidden'); }

            if(window.app.unsubChapters) window.app.unsubChapters();
            window.app.unsubChapters = onSnapshot(collection(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', novelId, 'chapters'), (snap) => {
                window.app.chapters = []; snap.forEach(d => window.app.chapters.push({ id: d.id, ...d.data() })); 
                window.app.chapters.sort((a,b) => { const orderA = a.order !== undefined ? a.order : a.createdAt; const orderB = b.order !== undefined ? b.order : b.createdAt; return orderA - orderB; });
                renderChapters();
            });
            window.app.switchView('novel-detail');
        };

        window.app.toggleSortMode = () => {
            window.app.isSortingMode = !window.app.isSortingMode;
            const btn = document.getElementById('btn-toggle-sort');
            if (window.app.isSortingMode) {
                btn.classList.replace('bg-slate-100', 'bg-custom-purple-600'); btn.classList.replace('text-slate-600', 'text-white'); btn.innerHTML = `<i class="fa-solid fa-check"></i> 完成`;
            } else {
                btn.classList.replace('bg-custom-purple-600', 'bg-slate-100'); btn.classList.replace('text-white', 'text-slate-600'); btn.innerHTML = `<i class="fa-solid fa-sort"></i> 排序`;
            }
            renderChapters();
        };

        function renderChapters() {
            const list = document.getElementById('chapter-list');
            if (window.app.chapters.length === 0) { list.innerHTML = '<div class="text-center py-10 text-custom-purple-400 text-sm font-bold">尚未新增任何章節，點擊上方「新章節」開始導入吧！</div>'; return; }
            
            if (window.app.isSortingMode) {
                list.innerHTML = window.app.chapters.map((ch, idx) => `
                    <div class="flex items-center justify-between p-4 bg-white border border-custom-purple-200 rounded-xl mb-2 shadow-sm">
                        <div class="flex items-center gap-3 flex-1 overflow-hidden">
                            <span class="text-custom-purple-400 font-mono text-xs w-6 shrink-0 text-right">${idx+1}.</span>
                            <h4 class="font-bold text-custom-purple-800 text-sm md:text-base line-clamp-1">${escapeHTML(ch.title)}</h4>
                        </div>
                        <div class="flex flex-row gap-2 items-center shrink-0 ml-2">
                            <button data-id="${ch.id}" onclick="window.app.moveChapter(event, '${ch.id}', -1)" class="w-8 h-8 flex items-center justify-center bg-custom-purple-100 text-custom-purple-600 hover:bg-custom-purple-200 rounded-full transition-colors ${idx === 0 ? 'opacity-30 pointer-events-none' : ''}">
                                <i class="fa-solid fa-arrow-up text-sm"></i>
                            </button>
                            <button data-id="${ch.id}" onclick="window.app.moveChapter(event, '${ch.id}', 1)" class="w-8 h-8 flex items-center justify-center bg-custom-purple-100 text-custom-purple-600 hover:bg-custom-purple-200 rounded-full transition-colors ${idx === window.app.chapters.length - 1 ? 'opacity-30 pointer-events-none' : ''}">
                                <i class="fa-solid fa-arrow-down text-sm"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                list.innerHTML = window.app.chapters.map((ch, idx) => `
                    <div class="swipe-container rounded-xl group overflow-visible pt-1 border-b border-custom-purple-50 last:border-0 pb-1 bg-custom-purple-50">
                        <div class="swipe-actions-left rounded-xl pl-3">
                            <button data-id="${ch.id}" onclick="window.app.openChapterForm(this.getAttribute('data-id')); event.stopPropagation();" class="w-10 h-10 bg-custom-purple-400 hover:bg-custom-purple-500 text-white rounded-full flex items-center justify-center transition-colors shadow"><i class="fa-solid fa-pen"></i></button>
                        </div>
                        <div class="swipe-actions-right rounded-xl pr-3">
                            <button data-id="${ch.id}" onclick="window.app.deleteChapter(event, this.getAttribute('data-id'))" class="w-10 h-10 bg-red-400 hover:bg-red-500 text-white rounded-full flex items-center justify-center transition-colors shadow"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <div class="swipe-content flex items-center justify-between p-4 bg-white hover:bg-custom-purple-50 rounded-xl transition-colors cursor-pointer z-10" onclick="window.app.openReader('${ch.id}')">
                            <div class="flex items-center gap-3 flex-1 overflow-hidden">
                                <span class="text-custom-purple-400 font-mono text-xs w-6 shrink-0 text-right">${idx+1}.</span>
                                <h4 class="font-bold text-custom-purple-800 text-sm md:text-base line-clamp-1">${escapeHTML(ch.title)}</h4>
                            </div>
                            <i class="fa-solid fa-play text-custom-purple-400 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </div>
                    </div>
                `).join('');
                setTimeout(initSwipe, 50);
            }
        }

        window.app.moveChapter = async (e, chId, direction) => {
            e.stopPropagation(); window.app.closeAllSwipes();
            const idx = window.app.chapters.findIndex(c => c.id === chId); if (idx === -1) return;
            const targetIdx = idx + direction; if (targetIdx < 0 || targetIdx >= window.app.chapters.length) return;
            const ch1 = window.app.chapters[idx], ch2 = window.app.chapters[targetIdx];
            let order1 = ch1.order !== undefined ? ch1.order : ch1.createdAt;
            let order2 = ch2.order !== undefined ? ch2.order : ch2.createdAt;
            if (order1 === order2) { order2 = order1 + (direction * 1000); }
            try { await Promise.all([ updateDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', window.app.currentNovelId, 'chapters', ch1.id), { order: order2 }), updateDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', window.app.currentNovelId, 'chapters', ch2.id), { order: order1 }) ]); } catch (err) { window.app.showAlert("調整順序失敗"); }
        };

        window.app.deleteChapter = (e, chId) => {
            e.stopPropagation(); const ch = window.app.chapters.find(x => x.id === chId); if (!ch) return;
            window.app.showDeleteConfirm(`刪除章節？`, `確定要刪除「${ch.title}」嗎？`, async () => { try { await deleteDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', window.app.currentNovelId, 'chapters', chId)); } catch(err) { window.app.showAlert("刪除失敗"); } });
        };

        window.app.openChapterForm = (chapterId = null) => {
            if (chapterId) { const ch = window.app.chapters.find(x => x.id === chapterId); if (!ch) return; window.app.editingChapterId = ch.id; document.getElementById('chapter-form-title').innerHTML = `<i class="fa-solid fa-pen text-custom-purple-500"></i> 編輯章節內容`; document.getElementById('chapter-title').value = ch.title || ''; document.getElementById('chapter-content').value = ch.content || ''; } 
            else { window.app.editingChapterId = null; document.getElementById('chapter-form-title').innerHTML = `<i class="fa-solid fa-file-import text-custom-purple-500"></i> 導入章節內容`; document.getElementById('chapter-title').value = ''; document.getElementById('chapter-content').value = ''; }
            window.app.switchView('chapter-form');
        };

        document.getElementById('btn-save-chapter').addEventListener('click', async () => {
            const title = document.getElementById('chapter-title').value.trim(), content = document.getElementById('chapter-content').value.trim();
            if(!title || !content) return window.app.showAlert("標題和內容不能為空！", "info");
            const btn = document.getElementById('btn-save-chapter'); btn.textContent = "儲存中...";
            try {
                if (window.app.editingChapterId) { await updateDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', window.app.currentNovelId, 'chapters', window.app.editingChapterId), { title, content, updatedAt: Date.now() }); } 
                else { let newOrder = Date.now(); if (window.app.chapters.length > 0) { const lastCh = window.app.chapters[window.app.chapters.length - 1]; newOrder = (lastCh.order !== undefined ? lastCh.order : lastCh.createdAt) + 1000; } await addDoc(collection(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', window.app.currentNovelId, 'chapters'), { title, content, createdAt: Date.now(), order: newOrder }); }
                document.getElementById('chapter-title').value = ''; document.getElementById('chapter-content').value = ''; window.app.switchView('novel-detail'); 
            } catch(e) { window.app.showAlert("儲存章節失敗"); } finally { btn.textContent = "儲存章節"; }
        });

        window.app.continueReading = () => {
            const novel = window.app.novels.find(n => n.id === window.app.currentNovelId);
            if (!novel || window.app.chapters.length === 0) return window.app.showAlert("請先新增章節！", "info");
            let targetChId = window.app.chapters[0].id;
            if (novel.lastReadChapterId && window.app.chapters.some(c => c.id === novel.lastReadChapterId)) { targetChId = novel.lastReadChapterId; }
            window.app.openReader(targetChId);
        }

        // ==========================================
        // 視圖 6: 閱讀器核心邏輯
        // ==========================================
        window.app.openReader = async (chapterId) => {
            window.app.currentChapterId = chapterId;
            const chapter = window.app.chapters.find(c => c.id === chapterId);
            const novel = window.app.novels.find(n => n.id === window.app.currentNovelId);
            if (!chapter || !novel) return;
            document.getElementById('reader-book-title').textContent = novel.title;
            document.getElementById('reader-chapter-title').textContent = chapter.title;
            document.getElementById('reader-content').textContent = chapter.content;
            if (window.app.currentUser && window.app.currentNovelId) {
                try { await updateDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'novels', window.app.currentNovelId), { lastReadChapterId: chapterId }); }
                catch (err) { console.warn('更新閱讀進度失敗：', err); }
            }
            updateReaderControls(); applyReaderSettings(); window.app.switchView('reader');
        };

        function updateReaderControls() {
            const idx = window.app.chapters.findIndex(c => c.id === window.app.currentChapterId); const btnPrev = document.getElementById('btn-prev-chapter'), btnNext = document.getElementById('btn-next-chapter');
            if (idx > 0) { btnPrev.classList.remove('opacity-50', 'cursor-not-allowed'); btnPrev.onclick = () => window.app.openReader(window.app.chapters[idx-1].id); } else { btnPrev.classList.add('opacity-50', 'cursor-not-allowed'); btnPrev.onclick = null; }
            if (idx < window.app.chapters.length - 1) { btnNext.classList.remove('opacity-50', 'cursor-not-allowed'); btnNext.onclick = () => window.app.openReader(window.app.chapters[idx+1].id); } else { btnNext.classList.add('opacity-50', 'cursor-not-allowed'); btnNext.onclick = null; }
        }

        window.app.changeFontSize = (step) => { window.app.readerSettings.fontSize += (step * 2); if(window.app.readerSettings.fontSize < 14) window.app.readerSettings.fontSize = 14; if(window.app.readerSettings.fontSize > 32) window.app.readerSettings.fontSize = 32; applyReaderSettings(); };
        window.app.changeTheme = (themeName) => { window.app.readerSettings.theme = themeName; applyReaderSettings(); };
        function applyReaderSettings() { const readerView = document.getElementById('view-reader'), content = document.getElementById('reader-content'); readerView.classList.remove('reader-theme-light', 'reader-theme-sepia', 'reader-theme-dark'); readerView.classList.add(`reader-theme-${window.app.readerSettings.theme}`); content.style.fontSize = `${window.app.readerSettings.fontSize}px`; }

        // 個人設定 Modal
        document.getElementById('btn-open-profile').addEventListener('click', () => {
            document.getElementById('input-nickname').value = window.app.profile.nickname || '';
            const avatar = document.getElementById('modal-preview-avatar');
            const avatarIcon = document.getElementById('modal-icon-avatar');
            if (window.app.profile.avatar) { avatar.src = window.app.profile.avatar; avatar.classList.remove('hidden'); avatarIcon.classList.add('hidden'); }
            else { avatar.removeAttribute('src'); avatar.classList.add('hidden'); avatarIcon.classList.remove('hidden'); }
            document.getElementById('input-avatar').value = '';
            document.getElementById('input-dashboard-bg').value = '';
            document.getElementById('btn-remove-bg').classList.toggle('hidden', !window.app.profile.dashboardBg);
            document.getElementById('profile-modal').classList.remove('hidden');
        });
        document.getElementById('input-avatar').addEventListener('change', async (e) => {
            if (!e.target.files[0]) return;
            try { window.app.profile.avatar = await compressImg(e.target.files[0], 300); document.getElementById('modal-preview-avatar').src = window.app.profile.avatar; document.getElementById('modal-preview-avatar').classList.remove('hidden'); document.getElementById('modal-icon-avatar').classList.add('hidden'); }
            catch (err) { window.app.showAlert(err.message || '圖片處理失敗'); e.target.value = ''; }
        });
        document.getElementById('input-dashboard-bg').addEventListener('change', async (e) => {
            if (!e.target.files[0]) return;
            try { window.app.profile.dashboardBg = await compressImg(e.target.files[0], 1200); document.getElementById('btn-remove-bg').classList.remove('hidden'); }
            catch (err) { window.app.showAlert(err.message || '圖片處理失敗'); e.target.value = ''; }
        });
        document.getElementById('btn-remove-bg').addEventListener('click', () => { window.app.profile.dashboardBg = null; document.getElementById('input-dashboard-bg').value = ''; document.getElementById('btn-remove-bg').classList.add('hidden'); });
        document.getElementById('btn-save-profile').addEventListener('click', async () => {
            if (!window.app.currentUser) return;
            const saveButton = document.getElementById('btn-save-profile');
            const saveText = document.getElementById('text-save-profile');
            const saveSpinner = document.getElementById('spinner-save-profile');
            saveButton.disabled = true; saveButton.classList.add('opacity-70', 'cursor-wait');
            saveText.textContent = '儲存中...'; saveSpinner.classList.remove('hidden');
            try {
                const nickname = document.getElementById('input-nickname').value.trim();
                await setDoc(doc(db, 'artifacts', APP_ID, 'users', window.app.currentUser.uid, 'profile', 'data'), { nickname, avatar: window.app.profile.avatar, dashboardBg: window.app.profile.dashboardBg }, { merge: true });
                window.app.profile.nickname = nickname;
                document.getElementById('header-nickname').textContent = nickname || '未命名讀者';
                window.app.showAlert('用戶設定已儲存完成！', 'info');
            } catch (e) {
                console.error('儲存用戶設定失敗：', e);
                window.app.showAlert('儲存失敗，請確認網路連線後再試一次。', 'error');
            } finally {
                saveButton.disabled = false; saveButton.classList.remove('opacity-70', 'cursor-wait');
                saveText.textContent = '儲存設定'; saveSpinner.classList.add('hidden');
            }
        });

        function escapeHTML(str) { return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    </script>
</body>
